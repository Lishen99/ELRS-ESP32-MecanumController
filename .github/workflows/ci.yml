name: CI

on:
  push:
  pull_request:

jobs:
  tests:
    name: Unit and end-to-end tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install PlatformIO and pyserial
        run: pip install platformio pyserial

      - name: Unit tests
        run: pio test -e native

      - name: Build the simulator
        run: pio run -e sim

      - name: End-to-end tests
        run: python host/python/test_with_simulator.py

  firmware:
    name: ESP32 firmware
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Cache PlatformIO packages
        uses: actions/cache@v6
        with:
          path: ~/.platformio
          key: platformio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}

      - name: Install PlatformIO
        run: pip install platformio

      - name: Build
        run: pio run -e esp32dev
