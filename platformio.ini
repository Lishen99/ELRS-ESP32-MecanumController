; Robot controller firmware for a classic ESP32 (ESP32 DevKit V1 and alike):
; ExpressLRS receiver and PS4 controller in, mecanum wheels and a host
; computer out.
;
;   pio run -t upload           build + flash the ESP32
;   pio device monitor          open the CLI (type 'help')
;   pio test -e native          unit tests on this computer
;   pio run -e sim              build the desktop simulator

[platformio]
default_envs = esp32dev

[env]
; The host protocol header is shared with the C++ host library.
build_flags =
    -I host/cpp/ElrsBridge/src
    -Wall
    -Wextra

[env:esp32dev]
board = esp32dev
platform = espressif32@6.12.0
framework = arduino
; The PS4 controller needs Bluepad32, which comes as its own build of the
; Arduino core (Arduino-ESP32 2.0.x with a Bluetooth stack for game
; controllers). This is Bluepad32 4.0.2, repackaged with the name PlatformIO
; expects; pinned to one commit so the build does not change underneath you.
; PlatformIO downloads it on the first build (about 200 MB).
platform_packages =
    framework-arduinoespressif32 @ https://github.com/maxgerhardt/pio-framework-bluepad32/archive/e010351b2cafe3a872f18878cb2d3e08f167c650.zip
build_src_filter = +<esp32/>
build_flags =
    ${env.build_flags}
    -DCORE_DEBUG_LEVEL=0
    ; Let src/esp32/output_guard.cpp stop the motors whenever the chip
    ; restarts: after a crash, and after any other CPU-only restart.
    -Wl,--wrap=esp_panic_handler
    -Wl,--wrap=esp_restart_noos
upload_speed = 921600
monitor_speed = 115200
; Pass everything through untouched so CLI line editing works, and leave the
; reset lines alone so opening the monitor does not reboot the board.
monitor_filters = direct
monitor_dtr = 0
monitor_rts = 0
; The unit tests run on the desktop only.
test_ignore = *

; Desktop builds of the hardware-independent core.
[desktop_common]
platform = native
build_src_filter = +<sim/>
build_flags =
    ${env.build_flags}
    -std=gnu++11
    -O2
    ; Helpers shared by the test programs.
    -I test/support
extra_scripts = pre:tools/native_libs.py

; The unit tests in test/ ('pio test -e native').
[env:native]
extends = desktop_common

; The simulator in src/sim: the core with TCP sockets in place of UARTs
; ('pio run -e sim'). It has its own environment because a test run leaves the
; test program, not the simulator, in the 'native' build folder.
[env:sim]
extends = desktop_common
test_ignore = *
